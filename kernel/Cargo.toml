[package]
name = "pi4-dns-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = ["board-virt"]
# Boot with the DHCP client (static address remains the fallback).
dhcp-default = []
# QEMU virt. The default image.
board-virt = []
# Raspberry Pi 4: link at 0xFFFF000000080000, PL011, EMMC, GENET.
# Build with --no-default-features --features board-pi4. Enabling it on
# top of the default features selects two boards and does not compile.
board-pi4 = []
# Reserved. Selecting it does not compile. A Pi 5 board is a later change.
board-pi5 = []

[dependencies]
cortex-a = { workspace = true }
tock-registers = { workspace = true }
aarch64-cpu = { workspace = true }
smoltcp = { workspace = true }
heapless = { workspace = true }
spin = { workspace = true }
log = { workspace = true }
embedded-sdmmc = { path = "../vendor/embedded-sdmmc", default-features = false }
embedded-hal = { workspace = true }

config = { path = "../config", default-features = false }

[[bin]]
name = "kernel8"
path = "src/main.rs"
