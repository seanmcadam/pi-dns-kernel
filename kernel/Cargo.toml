[package]
name = "pi4-dns-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = ["board-virt"]
# Boot with the DHCP client (static address remains the fallback).
dhcp-default = []
# QEMU virt. The default image.
board-virt = []
# Raspberry Pi 4: link at 0xFFFF000000080000, PL011, EMMC, GENET.
# Build with --no-default-features --features board-pi4. Enabling it on
# top of the default features selects two boards and does not compile.
board-pi4 = []
# Raspberry Pi 5: link at 0xFFFF000000200000, image name kernel_2712.img.
# Build with --no-default-features --features board-pi5. Enabling it on
# top of another board feature does not compile. RP1 Ethernet is not driven.
board-pi5 = []
# Pi 4 diagnostic: advertise 100 Mbit full duplex only. Gigabit RGMII
# delay mistakes are invisible at 100 Mbit because the MAC turns its
# internal delay off. `./scripts/build.sh pi4 --features phy-100`.
phy-100 = []

[dependencies]
cortex-a = { workspace = true }
tock-registers = { workspace = true }
aarch64-cpu = { workspace = true }
smoltcp = { workspace = true }
heapless = { workspace = true }
spin = { workspace = true }
log = { workspace = true }
embedded-sdmmc = { path = "../vendor/embedded-sdmmc", default-features = false }
embedded-hal = { workspace = true }

config = { path = "../config", default-features = false }
fwupd = { path = "../fwupd", default-features = false }

[[bin]]
name = "kernel8"
path = "src/main.rs"
