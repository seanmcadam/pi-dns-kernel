name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Run unit tests
      run: cargo test --workspace --lib
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy
      run: cargo clippy --workspace --lib -- -D warnings

  build-kernel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: aarch64-unknown-none
        components: llvm-tools-preview, rust-src
    
    - name: Install cross-compilation toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
    
    - name: Build kernel
      run: |
        # Unset RUSTFLAGS to avoid overriding .cargo/config.toml linker script flags
        unset RUSTFLAGS
        ./scripts/build.sh
    
    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel8.img
        path: boot/kernel8.img

  test-integration:
    runs-on: ubuntu-latest
    needs: build-kernel
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust and dependencies
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: aarch64-unknown-none
        components: llvm-tools-preview, rust-src
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-aarch64 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu netcat-openbsd python3
    
    - name: Download kernel
      uses: actions/download-artifact@v4
      with:
        name: kernel8.img
        path: boot/
    
    - name: Run integration tests
      run: ./scripts/test-integration.sh
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: qemu/
